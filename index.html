<!-- RODADA 1 · MODO INICIANTE
     Cole este bloco inteiro no seu HTML, logo ANTES de </body> (depois do </script> existente). -->
<style>
.bar,.brand{flex-wrap:wrap}
.tbar{width:60px}
.tbar button{width:54px;height:auto;min-height:44px;flex-direction:column;gap:2px;padding:4px 0}
.tbar small{font-size:10px;line-height:1.1;text-align:center}
.th small{font-size:10px;color:var(--mu)}
.ad{margin-left:auto;background:var(--ac);color:#fff;border-color:var(--ac);padding:5px 10px;white-space:nowrap}
#empty{position:absolute;left:10px;top:32px;width:min(440px,70vw);color:var(--tx);background:var(--pn2);border:1px dashed var(--ac);border-radius:6px;padding:8px 10px;font-size:13px;pointer-events:none;z-index:4}
#bhint{display:none}
.beg #bhint{display:inline}
.beg #laneV3,.beg #laneV2,.beg .heads .th:nth-child(2),.beg .heads .th:nth-child(3),.beg #bs,.beg #bre,.beg .tab:not([data-p=pj]),.beg #ttxt,.beg #ttl,.beg #shk,.beg #snl{display:none}
@media (pointer:coarse){.pf button,.tab,.ad,#bexp,#bmode,#btour,#bhelp,#bsnd{min-height:38px}.tbar button{min-height:48px}.clip u{width:16px}}
@media (max-width:860px){.bar>.mu{display:none}}
</style>
<script>
(function(){
// 1. Rótulos escritos nas ferramentas (funciona sem mouse)
const L={bu:'Desfazer',bre:'Refazer',bv:'Selecionar',bc:'Cortar',bs:'Dividir',bd:'Apagar',br:'Apagar e fechar'};
for(const id in L){const b=$('#'+id);if(b){const s=document.createElement('small');s.textContent=L[id];b.appendChild(s)}}
TIPS.bc[0]='Cortar (Lâmina)';TIPS.br[0]='Apagar e fechar o espaço (ripple)';
[['V1','vídeo'],['A1','áudio']].forEach(([k,n])=>{const b=[...document.querySelectorAll('.heads .th b')].find(x=>x.textContent===k);if(b){const s=document.createElement('small');s.textContent=n;b.after(s)}});

// 2. Mensagem de timeline vazia + roteiro de 3 passos
$('.tlh .mu').id='shk';$('#snap').parentElement.id='snl';
const em=document.createElement('div');em.id='empty';
em.textContent='Linha do tempo vazia. Clique ou toque em ＋ Adicionar ao lado de um clipe da lista (ou arraste-o até aqui).';
$('#inner').appendChild(em);
const hint=document.createElement('span');hint.id='bhint';hint.className='mu';
hint.textContent='1 ＋ Adicionar · 2 ▶ Reproduzir · 3 ✂ Cortar e clique no clipe';
$('.tlh').appendChild(hint);
const p0=pos;pos=function(){p0();em.style.display=items.length?'none':'block'};

// 3. Botão ＋ Adicionar em cada item da lista (único jeito no celular, onde arrastar da lista não funciona)
const rb=renderBin;
renderBin=function(){rb();document.querySelectorAll('#binl .bi').forEach(r=>{const b=document.createElement('button');b.className='ad';b.dataset.add=r.dataset.id;b.textContent='＋ Adicionar';r.appendChild(b)})};
$('#binl').addEventListener('click',e=>{
 const b=e.target.closest('.ad');if(!b)return;
 const s=SRC.find(x=>x.id===b.dataset.add),tr=s.t==='a'?'A1':'V1',
 st=Math.max(0,...items.filter(i=>i.tr===tr).map(i=>i.s+i.d));
 add(s.id,tr,st);const n=items[items.length-1];if(n){sel=n.id;t=n.s;render()}});
renderBin();

// 4. Modo iniciante / completo
let BEG=false;
const mb=document.createElement('button');mb.id='bmode';mb.className='on';$('#btour').before(mb);
TIPS.bmode=['Modo iniciante / completo','Iniciante mostra só o essencial: 1 trilha de vídeo, 1 de áudio e as ferramentas básicas. Completo libera efeitos, camadas, títulos e desafios.'];
function setBeg(v){
 if(v&&items.some(i=>i.tr==='V2'||i.tr==='V3')){toast('Há clipes nas camadas V2/V3. Apague-os para voltar ao modo iniciante.');return}
 BEG=v;document.body.classList.toggle('beg',v);
 mb.textContent=v?'🎓 Modo: iniciante':'🎓 Modo: completo';mb.classList.toggle('on',v);
 if(v)tab('pj');setTool('v');render()}
mb.onclick=()=>setBeg(!BEG);

// 5. Mini-tour de 3 passos (o tour completo continua no modo completo)
const FULL=STEPS.slice();
const MINI=[
 {t:'Bem-vindo! 🎬',p:'Editar vídeo é juntar pedaços (clipes) numa linha do tempo. Em 3 passos você faz isso. Vamos?',b:'Vamos lá'},
 {s:'#binl',t:'1. Coloque um clipe',p:'Na lista, clique ou toque em ＋ Adicionar. O clipe vai para a linha do tempo, na faixa de vídeo.',go:()=>{tab('pj');return{n:items.length}},ok:b=>items.length>b.n},
 {s:'#play',t:'2. Veja o resultado',p:'Clique ou toque em ▶. O monitor mostra o que está na linha do tempo.',go:()=>{need();return{t}},ok:b=>timer||t!==b.t},
 {s:'#bc',t:'3. Corte o clipe',p:'Clique em ✂ Cortar e depois em cima do clipe para dividi-lo em dois.',h:'Para voltar a mover clipes, clique em Selecionar.',go:()=>{need();return{n:items.length}},ok:b=>items.length>b.n},
 {t:'Pronto! 🏆',p:'Você já sabe o básico. Agora arraste um pedaço para mudar a ordem ou use Apagar. Quando quiser mais recursos, ative o Modo completo.',b:'Concluir'}];
function startTour(){STEPS.splice(0,STEPS.length,...(BEG?MINI:FULL));tour(true)}
$('#btour').onclick=startTour;

// Início: modo iniciante ligado; mini-tour abre sozinho na primeira visita
setBeg(true);
let seen=null;try{seen=localStorage.getItem('ee_v1')}catch(e){}
if(!seen){try{localStorage.setItem('ee_v1','1')}catch(e){}setTimeout(startTour,500)}
})();
</script>
